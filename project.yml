name: ObsWatchRemote

options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

# Team ID 写在 Config/Signing.local.xcconfig（不入库），见 Config/Signing.local.xcconfig.example
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    # 改成你自己的反向域名，例如 com.yourname
    BUNDLE_ID_PREFIX: com.sadnoo
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ObsRemote:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    dependencies:
      - target: ObsRemoteWatch
    scheme: {}
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: OBS 遥控
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: 需要访问局域网，以连接电脑上的 OBS（obs-websocket）。
        NSHealthShareUsageDescription: 读取昨晚的睡眠记录，计算睡眠评分并显示到 OBS 直播画面。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    entitlements:
      path: iOS/ObsRemote.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).obsremote
        TARGETED_DEVICE_FAMILY: "1"

  ObsRemoteWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    scheme: {}
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: OBS 遥控
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).obsremote
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: 读取实时心率，用于推送到 OBS 直播画面。
        NSHealthUpdateUsageDescription: 直播期间开启一次锻炼，以便手表持续测量心率。
    entitlements:
      path: Watch/ObsRemoteWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).obsremote.watchkitapp
